name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --workspace -- -D warnings
    - name: Build
      run: cargo build --workspace
    - name: Run tests
      run: cargo test --workspace
