[package]
name = "plaza-os"
version = "0.1.0-dp1"
edition = "2021"
description = "Guest OS builder — rootfs construction, snapshots, secure boot, OTA updates"

[dependencies]
plaza-foundation = { version = "0.1.0-dp1", path = "../../shared/plaza-foundation" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[workspace]
